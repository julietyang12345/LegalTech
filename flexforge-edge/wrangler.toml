# Cloudflare Workers configuration for FlexForge Edge API
# See https://developers.cloudflare.com/workers/wrangler/configuration/

name = "flexforge-edge"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (non-sensitive)
# Backend URL via Cloudflare Tunnel (private access for worker only)
[vars]
BACKEND_URL = "https://api-backend.flexforge.ai"

# KV Namespaces - Create with: npx wrangler kv:namespace create <NAME>
# After creating, replace the placeholder IDs below with actual IDs

[[kv_namespaces]]
binding = "VIDEO_CACHE"
id = "52adee5fee594ffa95b0b8c6c7453e8a"

[[kv_namespaces]]
binding = "TRANSCRIPT_CACHE"
id = "e9297e016a7143cba04de82cedf8f859"

[[kv_namespaces]]
binding = "DOC_CACHE"
id = "0c222cee5064403b89edab4753b7092d"

# Secrets - Set with: npx wrangler secret put <SECRET_NAME>
# Required secrets:
# - JWT_SECRET: Same JWT secret as your backend (for token verification)
# - CF_ACCESS_CLIENT_ID: Cloudflare Access Service Token Client ID
# - CF_ACCESS_CLIENT_SECRET: Cloudflare Access Service Token Client Secret

# Development overrides
[env.development]
vars = { BACKEND_URL = "http://localhost:4000" }

# Staging environment (optional)
[env.staging]
vars = { BACKEND_URL = "https://staging-api.flexforge.app" }

