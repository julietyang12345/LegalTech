# Cloudflare Workers configuration for FlexForge Frontend (Static Site)
# See https://developers.cloudflare.com/workers/static-assets/

name = "app"
compatibility_date = "2024-01-01"

# Static assets configuration
# The frontend is built with Vite and outputs to ./dist
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain configuration
routes = [
  { pattern = "app.flexforge.ai", custom_domain = true }
]

# Environment-specific overrides
[env.production]
name = "app"

[env.staging]
name = "app-staging"
