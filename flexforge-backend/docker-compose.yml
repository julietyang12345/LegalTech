version: '3.8'

services:
  # ============================================
  # FlexForge Core Services
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: flexforge-db
    environment:
      POSTGRES_USER: flexforge
      POSTGRES_PASSWORD: local_dev_password_2024
      POSTGRES_DB: flexforge_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flexforge-network

  redis:
    image: redis:7-alpine
    container_name: flexforge-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - flexforge-network

volumes:
  postgres_data:
  redis_data:

networks:
  flexforge-network:
    driver: bridge
