version: "3.9"

services:
  visualmind-db:
    image: postgres:15-alpine
    container_name: visualmind-db
    environment:
      POSTGRES_USER: visualmind
      POSTGRES_PASSWORD: visualmind_dev_password
      POSTGRES_DB: visualmind_dev
    ports:
      - "5434:5432"
    volumes:
      - visualmind_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visualmind -d visualmind_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  visualmind-backend:
    build:
      context: ../visualmind-backend
    container_name: visualmind-backend
    env_file:
      - ../visualmind-backend/.env
    environment:
      DATABASE_URL: postgresql://visualmind:visualmind_dev_password@visualmind-db:5432/visualmind_dev
    ports:
      - "4300:4300"
    depends_on:
      visualmind-db:
        condition: service_healthy

  visualmind-frontend:
    build:
      context: ../visualmind-frontend
    container_name: visualmind-frontend
    environment:
      VITE_BACKEND_ORIGIN: http://visualmind-backend:4300
    ports:
      - "4173:4173"
    depends_on:
      - visualmind-backend

volumes:
  visualmind_pg_data:
